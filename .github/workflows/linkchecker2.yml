name: linkchecker

on:
  workflow_dispatch:
  push:
  pull_request:
    branches: [ develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: get
        uses: actions/checkout@v4

      - name: install
        run: |
          sudo apt install -y libunwind-dev
          sudo apt install -y graphviz
          sudo apt install -y --no-install-recommends doxygen
          sudo apt install -y cmake

      - name: install lychee
        run: |
          curl -sSL https://github.com/lycheeverse/lychee/releases/latest/download/lychee-x86_64-unknown-linux-gnu.tar.gz | tar -xz
          sudo mv lychee /usr/local/bin/
          chmod +x /usr/local/bin/lychee

      - name: build
        run: |
          mkdir build
          cd build
          cmake -DHDF5_BUILD_DOC:BOOL=ON ..
          make doxygen

      - name: check links with lychee
        run: |
          cd build/hdf5lib_docs/html
          lychee \
          --exclude-mail \
          --exclude "eigen.tuxfamily.org" \
          --exclude "gnu.org" \
          --exclude "en.wikipedia.org" \
          --exclude "help.hdfgroup.org" \
          --exclude "libpng.org" \
          --exclude "my.cdash.org" \
          --exclude "www.oreilly.com" \
          --exclude "preshing.com" \
          --exclude "semver.org" \
          --exclude "sourceforge.net" \
          --exclude "www.youtube.com" \
          --exclude "youtu.be" \
          --exclude "hdfeos.org" \
          --max-retries 3 \
          --retry-wait-time 5 \
          --timeout 30 \
          --user-agent "Mozilla/5.0 (compatible; Lychee)" \
          --verbose \
          ./index.html
        continue-on-error: true

      - name: check internal links only
        run: |
          cd build/hdf5lib_docs/html
          lychee \
          --exclude-all-private \
          --offline \
          --verbose \
          ./index.html
