name: cve dev

# Triggers the workflow on push or pull request or on demand
on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '.github/CODEOWNERS'
      - '.github/FUNDING.yml'
      - '.github/workflows/**'
      - 'docs/**'
      - 'release_docs/**'
      - 'ACKNOWLEDGEMENTS'
      - 'LICENSE**'
      - '**.md'
      - 'kotoba/**'
      - '.github/workflows/kotoba.yml'
  pull_request:
    branches: [ develop ]
    paths-ignore:
      - '.github/CODEOWNERS'
      - '.github/FUNDING.yml'
      - '.github/workflows/**'
      - 'docs/**'
      - 'release_docs/**'
      - 'ACKNOWLEDGEMENTS'
      - 'LICENSE**'
      - '**.md'
      - 'kotoba/**'
      - '.github/workflows/kotoba.yml'

# Using concurrency to cancel any in-progress job or run
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: CVE regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # Prevents tokens from being written to Git config files

      - name: Install HDF5
        env:
          RUNNER_WORKSPACE: ${{ runner.workspace }}
        run: |
          mkdir "$RUNNER_WORKSPACE/build"
          cd "$RUNNER_WORKSPACE/build"
          cmake -DCMAKE_INSTALL_PREFIX=/usr/local -DBUILD_TESTING:BOOL=OFF $GITHUB_WORKSPACE
          make
          sudo make install
      - name: Checkout CVE test repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # Prevents tokens from being written to Git config files
          repository: HDFGroup/cve_hdf5
          path: cve_hdf5
      - name: Run regression tests
        run: |
          cd cve_hdf5
          export LD_LIBRARY_PATH="$LD_LIBRARY_PATH:/usr/local/lib"
          ./test_hdf5_cve.sh /usr/local/bin ./cve_out
