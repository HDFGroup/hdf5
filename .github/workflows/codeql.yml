name: "CodeQL"

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]
  schedule:
    - cron: "16 7 * * 0"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false

    steps:
      - name: Install Dependencies (Linux)
        run: |
          sudo gem install apt-spy2
          sudo apt-spy2 check
          sudo apt-spy2 fix --commit
          sudo apt update
          sudo apt upgrade
          sudo apt-get install openmpi-bin openmpi-common mpi-default-dev
          #sudo apt install mpich
          # Set env vars
          echo "OS_NAME=linux" >> $GITHUB_ENV
          echo "CC=mpicc" >> $GITHUB_ENV
          echo "FC=mpif90" >> $GITHUB_ENV
          echo "F77=mpif90" >> $GITHUB_ENV
          mpiexec_cmd="mpiexec --use-hwthread-cpus -n 4"
          echo "MPIEXEC=$mpiexec_cmd" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v3
        
##################################
# CONFIGURE HDF5
##################################

      - name: configure HDF5
        run: |
          mkdir build;cd build
          cmake -G "Unix Makefiles" \
            -DCMAKE_INSTALL_PREFIX=$PWD/hdf5 \
            -DHDF5_BUILD_FORTRAN:BOOL=OFF \
            -DENABLE_EXTENDED_TESTS:BOOL=ON \
            -DHDF5_BUILD_JAVA:BOOL=OFF \
            -DBUILD_TESTING:BOOL=ON \
            -DHDF5_ENABLE_THREADSAFE:BOOL=OFF \
            -DHDF5_BUILD_DOC:BOOL=OFF \
            -DHDF5_TEST_API:BOOL=OFF \
            -DHDF5_BUILD_TOOLS:BOOL=ON \
            -DHDF5_TEST_API_ENABLE_ASYNC:BOOL=OFF \
            -DHDF5_ENABLE_SZIP_SUPPORT:BOOL=OFF \
            -DHDF5_ENABLE_ZLIB_SUPPORT:BOOL=OFF \
            -DBUILD_SHARED_LIBS:BOOL=ON \
            -DBUILD_STATIC_LIBS:BOOL=ON \
            -DHDF5_ENABLE_PARALLEL:BOOL=ON \
            -DDHDF5_ENABLE_SUBFILING_VFD:BOOL=ON \
            ..

##################################
# CONFIGURE CodeQL
##################################
      
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: c-cpp
          build-mode: manual

          config: |
             query-filters:
               - exclude:
                   id: cpp/toctou-race-condition
               - exclude:
                   id: cpp/short-global-name

          queries: +security-and-quality

      - name: Build
        run: |
          cd build
          cmake --build . --config Release
          ctest -C Release
        shell: bash

# NOTE: C/C++ does not support path-based filtering when using the manual build mode.
# The "paths" and "paths-ignore" configuration properties will have no effect for this
# language. If desired, you can use the advanced-security/filter-sarif Action to rewrite
# the SARIF file to exclude alerts from these paths. For more information,
# see https://github.com/advanced-security/filter-sarif

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:c-cpp"
          output: sarif-results
          upload: failure-only

      - name: filter-sarif
        uses: advanced-security/filter-sarif@main
        with:
          # filter out all test files
          # filter out all testpar files
          patterns: |
            -**/test/**
            -**/testpar/**
          input: sarif-results/cpp.sarif
          output: sarif-results/cpp.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: sarif-results/cpp.sarif

      - name: Upload loc as a Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sarif-results
          path: sarif-results
          retention-days: 1
