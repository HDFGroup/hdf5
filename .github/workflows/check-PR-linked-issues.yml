name: Check PR for linked issue
on:
  pull_request:
    branches: [ chckPR ]
    types: [labeled, unlabeled,opened, edited, reopened, synchronize]

jobs:
  check_pull_requests:
    runs-on: ubuntu-latest
    name: Check
    permissions:
      issues: read
      pull-requests: write
    strategy:
      fail-fast: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use the action
        uses: nearform-actions/github-action-check-linked-issues@v1.4.28
        id: check-linked-issues
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          exclude-branches: "release/**, dependabot/**"
      # Use the output from the `check` step
      - name: Get the output
        run: echo "Has linked issues? ${{ steps.check.outputs.linked_issues_count }}"
