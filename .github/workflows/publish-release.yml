name: hdf5 publish release

# Triggers the workflow on demand
on:
  workflow_dispatch:
    inputs:
      use_tag:
        description: HDF5 Release version tag (e.g., 2.0.0)
        type: string
        required: true
      file_name:
        description: HDF5 Release file name base
        type: string
        required: true
      target_dir:
        description: HDF5 target bucket directory
        type: string
        required: true
      dry_run:
        description: Dry run mode (skip S3 upload)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Validate Inputs
        env:
          INPUT_USE_TAG: ${{ inputs.use_tag }}
          INPUT_TARGET_DIR: ${{ inputs.target_dir }}
          INPUT_FILE_NAME: ${{ inputs.file_name }}
        run: |
          set -euo pipefail
          echo "Validating inputs..."
          if [[ ! "$INPUT_USE_TAG" =~ ^hdf5[_-][0-9]+[._][0-9]+[._][0-9]+([._][0-9]+)?(-.*)?$ ]]; then
            echo "❌ Invalid tag format. Expected: hdf5_X.Y.Z, hdf5-X_Y_Z, or hdf5_X.Y.Z.W"
            exit 1
          fi
          if [[ "$INPUT_TARGET_DIR" == *".."* ]] || [[ "$INPUT_TARGET_DIR" == /* ]]; then
            echo "❌ Invalid target_dir. Cannot contain '..' or start with '/'"
            exit 1
          fi
          if [[ "$INPUT_FILE_NAME" == *".."* ]] || [[ "$INPUT_FILE_NAME" == *"/"* ]] || [[ "$INPUT_FILE_NAME" =~ [^a-zA-Z0-9._-] ]]; then
            echo "❌ Invalid file_name. Can only contain alphanumeric, dots, underscores, and hyphens"
            exit 1
          fi
          echo "✅ Input validation passed"

      # Checks-out your repository under $GITHUB_WORKSPACE
      - name: Get Sources
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # Updated to latest stable v6.0.3
        with:
          fetch-depth: 0
          ref: '${{ github.head_ref || github.ref_name }}'

      - name: Create download directory
        run: mkdir -p HDF5

      - name: Get HDF5 release assets
        uses: robinraju/release-downloader@28fc21f50d76778e7023361aa1f863e717d3d56f # More reliable alternative v1.13
        with:
          repository: HDFGroup/hdf5
          tag: ${{ inputs.use_tag }}
          fileName: ${{ inputs.file_name }}*
          out-file-path: HDF5
          extract: false

      - name: Verify downloaded files
        env:
          INPUT_FILE_NAME: ${{ inputs.file_name }}
        run: |
          set -euo pipefail
          echo "📁 Downloaded files:"
          ls -la HDF5/
          
          # Check for expected files
          EXPECTED_FILES=("$INPUT_FILE_NAME.doxygen.zip" "$INPUT_FILE_NAME.html.abi.reports.tar.gz")
          for file in "${EXPECTED_FILES[@]}"; do
            if [ ! -f "HDF5/$file" ]; then
              echo "⚠️  Warning: Expected file not found: $file"
            else
              echo "✅ Found: $file"
            fi
          done

      - name: Setup AWS CLI
        if: ${{ !inputs.dry_run }}
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Generate index.html for downloads directory
        env:
          INPUT_USE_TAG: ${{ inputs.use_tag }}
        run: |
          set -euo pipefail
          echo "📄 Generating index.html for downloads directory..."
          chmod +x .github/scripts/generate-index-html.sh
          .github/scripts/generate-index-html.sh \
            "./HDF5" \
            "HDF5 $INPUT_USE_TAG - Downloads" \
            "Release binaries, source code, and documentation packages for HDF5 $INPUT_USE_TAG" \
            "../"
          echo "✅ Downloads index.html generated"

      - name: Sync release files to S3 bucket
        if: ${{ !inputs.dry_run }}
        env:
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          TARGET_PATH: ${{ vars.TARGET_PATH }}
          INPUT_TARGET_DIR: ${{ inputs.target_dir }}
        run: |
          set -euo pipefail
          echo "🚀 Syncing release files to S3..."
          aws s3 sync ./HDF5 s3://$AWS_S3_BUCKET/$TARGET_PATH/$INPUT_TARGET_DIR/downloads \
            --delete \
            --exclude="*" \
            --include="*.tar.gz" \
            --include="*.zip" \
            --include="*.msi" \
            --include="*.dmg" \
            --include="*.exe" \
            --include="*.sha256" \
            --include="index.html" \
            --exact-timestamps

          # Upload index.html with proper content type
          aws s3 cp ./HDF5/index.html \
            s3://$AWS_S3_BUCKET/$TARGET_PATH/$INPUT_TARGET_DIR/downloads/index.html \
            --content-type "text/html" \
            --metadata-directive REPLACE
          echo "✅ Release files sync completed"

      - name: Process documentation
        env:
          INPUT_FILE_NAME: ${{ inputs.file_name }}
        run: |
          set -euo pipefail
          DOC_FILE="HDF5/$INPUT_FILE_NAME.doxygen.zip"
          if [ -f "$DOC_FILE" ]; then
            echo "📚 Processing documentation..."
            unzip -q "$DOC_FILE"
            if [ -d "$INPUT_FILE_NAME.doxygen" ]; then
              echo "✅ Documentation extracted successfully"
            else
              echo "❌ Documentation extraction failed"
              exit 1
            fi
          else
            echo "⚠️  Documentation file not found, skipping..."
          fi

      - name: Generate index.html for documentation directory
        env:
          INPUT_FILE_NAME: ${{ inputs.file_name }}
          INPUT_USE_TAG: ${{ inputs.use_tag }}
        run: |
          set -euo pipefail
          if [ -d "$INPUT_FILE_NAME.doxygen" ]; then
            echo "📄 Generating index.html for documentation directory..."
            .github/scripts/generate-index-html.sh \
              "./$INPUT_FILE_NAME.doxygen" \
              "HDF5 $INPUT_USE_TAG - Documentation" \
              "Doxygen API documentation for HDF5 $INPUT_USE_TAG" \
              "../../"
            echo "✅ Documentation index.html generated"
          else
            echo "⚠️  No documentation directory found, skipping index generation..."
          fi

      - name: Sync documentation to S3 bucket
        if: ${{ !inputs.dry_run }}
        env:
          INPUT_FILE_NAME: ${{ inputs.file_name }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          TARGET_PATH: ${{ vars.TARGET_PATH }}
          INPUT_TARGET_DIR: ${{ inputs.target_dir }}
        run: |
          set -euo pipefail
          if [ -d "$INPUT_FILE_NAME.doxygen" ]; then
            echo "📚 Syncing documentation to S3..."
            aws s3 sync ./$INPUT_FILE_NAME.doxygen \
              s3://$AWS_S3_BUCKET/$TARGET_PATH/$INPUT_TARGET_DIR/documentation/doxygen \
              --delete \
              --content-type "text/html" \
              --metadata-directive REPLACE
            echo "✅ Documentation sync completed"
          else
            echo "⚠️  No documentation directory found, skipping..."
          fi

      - name: Process compatibility reports
        env:
          INPUT_FILE_NAME: ${{ inputs.file_name }}
        run: |
          set -euo pipefail
          COMPAT_FILE="HDF5/$INPUT_FILE_NAME.html.abi.reports.tar.gz"
          if [ -f "$COMPAT_FILE" ]; then
            echo "📊 Processing compatibility reports..."
            tar -xzf "$COMPAT_FILE"
            if [ -d "hdf5" ]; then
              echo "✅ Compatibility reports extracted successfully"
            else
              echo "❌ Compatibility reports extraction failed"
              exit 1
            fi
          else
            echo "⚠️  Compatibility reports file not found, skipping..."
          fi

      - name: Generate index.html for compatibility reports directory
        env:
          INPUT_USE_TAG: ${{ inputs.use_tag }}
        run: |
          set -euo pipefail
          if [ -d "hdf5" ]; then
            echo "📄 Generating index.html for compatibility reports directory..."
            .github/scripts/generate-index-html.sh \
              "./hdf5" \
              "HDF5 $INPUT_USE_TAG - Compatibility Reports" \
              "ABI/API compatibility reports for HDF5 $INPUT_USE_TAG" \
              "../"
            echo "✅ Compatibility reports index.html generated"
          else
            echo "⚠️  No compatibility reports directory found, skipping index generation..."
          fi

      - name: Sync compatibility reports to S3 bucket
        if: ${{ !inputs.dry_run }}
        env:
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          TARGET_PATH: ${{ vars.TARGET_PATH }}
          INPUT_TARGET_DIR: ${{ inputs.target_dir }}
        run: |
          set -euo pipefail
          if [ -d "hdf5" ]; then
            echo "📊 Syncing compatibility reports to S3..."
            aws s3 sync ./hdf5 \
              s3://$AWS_S3_BUCKET/$TARGET_PATH/$INPUT_TARGET_DIR/compat_report \
              --delete \
              --content-type "text/html" \
              --metadata-directive REPLACE
            echo "✅ Compatibility reports sync completed"
          else
            echo "⚠️  No compatibility reports directory found, skipping..."
          fi

      - name: Generate main release directory index.html
        env:
          INPUT_TARGET_DIR: ${{ inputs.target_dir }}
          INPUT_USE_TAG: ${{ inputs.use_tag }}
        run: |
          set -euo pipefail
          echo "📄 Generating main release directory index.html..."

          # Create a temporary directory structure to mimic the S3 layout
          mkdir -p release_root/$INPUT_TARGET_DIR/{downloads,documentation,compat_report}

          # Create placeholder files so the script can list them
          touch "release_root/$INPUT_TARGET_DIR/downloads/.placeholder"
          touch "release_root/$INPUT_TARGET_DIR/documentation/.placeholder"
          touch "release_root/$INPUT_TARGET_DIR/compat_report/.placeholder"

          # Generate index for the release directory
          .github/scripts/generate-index-html.sh \
            "release_root/$INPUT_TARGET_DIR" \
            "HDF5 $INPUT_USE_TAG" \
            "Release files, documentation, and compatibility reports for HDF5 $INPUT_USE_TAG" \
            "../"

          echo "✅ Main release index.html generated"

      - name: Upload main release directory index.html
        if: ${{ !inputs.dry_run }}
        env:
          INPUT_TARGET_DIR: ${{ inputs.target_dir }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          TARGET_PATH: ${{ vars.TARGET_PATH }}
        run: |
          set -euo pipefail
          echo "📤 Uploading main release directory index.html..."
          aws s3 cp "release_root/$INPUT_TARGET_DIR/index.html" \
            s3://$AWS_S3_BUCKET/$TARGET_PATH/$INPUT_TARGET_DIR/index.html \
            --content-type "text/html" \
            --metadata-directive REPLACE
          echo "✅ Main index.html uploaded"

      - name: Summary
        env:
          INPUT_USE_TAG: ${{ inputs.use_tag }}
          INPUT_FILE_NAME: ${{ inputs.file_name }}
          INPUT_TARGET_DIR: ${{ inputs.target_dir }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          TARGET_PATH: ${{ vars.TARGET_PATH }}
        run: |
          set -euo pipefail
          echo "🎉 HDF5 Release Publication Summary"
          echo "=================================="
          echo "🏷️  Tag: $INPUT_USE_TAG"
          echo "📁 File Base: $INPUT_FILE_NAME"
          echo "🎯 Target Directory: $INPUT_TARGET_DIR"
          echo "🌐 Dry Run: $INPUT_DRY_RUN"
          echo ""
          if [ "$INPUT_DRY_RUN" == "true" ]; then
            echo "ℹ️  This was a dry run - no files were uploaded to S3"
          else
            echo "✅ Release published successfully!"
            echo "📍 Main page: s3://$AWS_S3_BUCKET/$TARGET_PATH/$INPUT_TARGET_DIR/index.html"
            echo "📍 Downloads: s3://$AWS_S3_BUCKET/$TARGET_PATH/$INPUT_TARGET_DIR/downloads"
            echo "📖 Documentation: s3://$AWS_S3_BUCKET/$TARGET_PATH/$INPUT_TARGET_DIR/documentation/doxygen"
            echo "📊 Reports: s3://$AWS_S3_BUCKET/$TARGET_PATH/$INPUT_TARGET_DIR/compat_report"
          fi
