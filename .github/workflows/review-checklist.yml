name: Review Checklist

# Posts a per-area sign-off checklist on every PR and auto-checks each item
# when one of that area's designated owners submits an approval.
#
# Reviewer lists are derived entirely from .github/CODEOWNERS — no duplication.
# To add an area or change owners, edit only CODEOWNERS.
#
# Two-trigger design to handle fork PRs safely:
#
# pull_request_target — open / synchronize / reopened
#   Runs with a full write token even for fork PRs. Safe because the base
#   branch (develop) is always checked out — the fork's code never executes.
#
# workflow_run — review approvals (via review-checklist-gather.yml)
#   pull_request_review grants only a read-only token for fork PRs, so
#   reviews are funnelled through a lightweight gather workflow that saves
#   the PR number as an artifact, then this workflow runs with a full token.

on:
  # zizmor: ignore[pull-request-target]
  # Safe: checkout has no ref: override so the base branch (develop) is always
  # used — the fork's code is never checked out or executed.
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [develop]
  workflow_run:
    workflows: ["Review Checklist (Gather Review)"]
    types: [completed]

concurrency:
  group: review-checklist-${{ github.event.pull_request.number || github.event.workflow_run.head_sha }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  checklist:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.base.ref == 'develop') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success')

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Download PR number (review path)
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pr-number-review
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fs = require('fs');
            let prNumber, isReview;
            if (context.eventName === 'workflow_run') {
              prNumber = parseInt(fs.readFileSync('pr_number.txt', 'utf8').trim());
              isReview = true;
            } else {
              prNumber = context.payload.pull_request.number;
              isReview = false;
            }
            const run = require('./.github/scripts/review-checklist.js');
            await run({ github, context, core, prNumber, isReview });
