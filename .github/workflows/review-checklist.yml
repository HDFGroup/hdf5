name: Review Checklist

# Posts a per-area sign-off checklist on every PR and auto-checks each item
# when one of that area's designated owners submits an approval.
#
# Reviewer lists are derived entirely from .github/CODEOWNERS — no duplication.
# To add an area or change owners, edit only CODEOWNERS.
#
# Uses a two-workflow pattern to support fork PRs without pull_request_target:
# - review-checklist-gather.yml runs in the PR's read-only context and saves
#   the PR number as an artifact.
# - This workflow runs with a full write token, downloads that artifact, and
#   does the work. It never executes code from the fork.

on:
  workflow_run:
    workflows: ["Review Checklist (Gather)"]
    types: [completed]
  pull_request_review:
    types: [submitted]

concurrency:
  group: review-checklist-${{ github.event.pull_request.number || github.event.workflow_run.head_sha }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  checklist:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'pull_request_review' &&
       github.event.review.state == 'approved' &&
       github.event.pull_request.base.ref == 'develop')

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Download PR number
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pr-number
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            let prNumber;
            if (context.eventName === 'workflow_run') {
              prNumber = parseInt(fs.readFileSync('pr_number.txt', 'utf8').trim());
            } else {
              prNumber = context.payload.pull_request.number;
            }
            const run = require('./.github/scripts/review-checklist.js');
            await run({ github, context, core, prNumber });
