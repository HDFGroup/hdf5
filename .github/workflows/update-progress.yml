name: Release Progress

on:
  schedule:
    - cron: '0 */24 * * *'  # Run every 24 hours
  workflow_dispatch:  # Allow manual triggering

jobs:
  check-progress:
    runs-on: ubuntu-latest
    permissions:
      gists: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
        
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'
        
    - name: Install dependencies
      run: |
        pip install requests
        
    - name: Calculate progress (run once)
      id: progress
      run: |
        # Run the Python script and capture all output
        python update-progress.py > progress_output.txt 2>&1
        
        # Extract values from the output
        PERCENTAGE=$(grep "^percentage=" progress_output.txt | cut -d'=' -f2)
        DONE_TOTAL=$(grep "^Done / Total:" progress_output.txt | cut -d':' -f2 | xargs)
        DONE=$(echo "$DONE_TOTAL" | cut -d' ' -f1)
        TOTAL=$(echo "$DONE_TOTAL" | cut -d' ' -f2)
        
        # Set outputs for use in subsequent steps
        echo "percentage=$PERCENTAGE" >> $GITHUB_OUTPUT
        echo "done=$DONE" >> $GITHUB_OUTPUT
        echo "total=$TOTAL" >> $GITHUB_OUTPUT
        
        # Display the captured output for debugging
        echo "=== Python Script Output ==="
        cat progress_output.txt
        echo "=========================="
        
        # Clean up
        rm -f progress_output.txt
        
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_OWNER: "HDFGroup"
        GITHUB_PROJECT_NUMBER: "39"

    - name: Update progress badge Gist
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GIST_ID: ${{ secrets.GIST_ID }}
      run: |
        PERCENTAGE="${{ steps.progress.outputs.percentage }}"
        DONE="${{ steps.progress.outputs.done }}"
        TOTAL="${{ steps.progress.outputs.total }}"
        
        # Determine badge color
        if [ $(awk "BEGIN {print ($PERCENTAGE >= 90)}") -eq 1 ]; then
          COLOR="brightgreen"; STATUS="🟢 Readying for Deployment"
        elif [ $(awk "BEGIN {print ($PERCENTAGE >= 60)}") -eq 1 ]; then
          COLOR="yellow"; STATUS="🟡 Nearing Completion"
        elif [ $(awk "BEGIN {print ($PERCENTAGE >= 40)}") -eq 1 ]; then
          COLOR="orange"; STATUS="🟠 In Development"
        else
          COLOR="red"; STATUS="🔴 Initial Phase"
        fi
        
        echo "::notice title=Release Progress::${PERCENTAGE}% Complete (${DONE}/${TOTAL}) - ${STATUS}"
        
        # Create badge JSON for shields.io endpoint
        BADGE_JSON=$(jq -n \
          --arg percentage "$PERCENTAGE" \
          --arg done "$DONE" \
          --arg total "$TOTAL" \
          --arg color "$COLOR" \
          '{
            "schemaVersion": 1,
            "label": "Release Progress",
            "message": "\($percentage)% (\($done)/\($total))",
            "color": $color,
            "style": "flat-square"
          }')
          
        # The filename in the Gist must match the one created manually
        GIST_NAME="release-progress-${GITHUB_REPOSITORY##*/}.json"
        
        # Directly update the existing Gist
        echo "Updating Gist: ${GIST_ID}"
        curl -s -L -X PATCH \
          -H "Authorization: token ${GITHUB_TOKEN}" \
          -H "Accept: application/vnd.github.v3+json" \
          "https://api.github.com/gists/${GIST_ID}" \
          -d '{
            "files": {
              "'"$GIST_NAME"'": {
                "content": '"$BADGE_JSON"'
              }
            }
          }'
          
        # Create step summary
        echo "## 📊 Release Progress: ${PERCENTAGE}%" >> $GITHUB_STEP_SUMMARY
        echo "**Status:** ${STATUS}" >> $GITHUB_STEP_SUMMARY
        echo "**Progress:** ${DONE} of ${TOTAL} release blockers completed" >> $GITHUB_STEP_SUMMARY