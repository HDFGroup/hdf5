        uses: actions/checkout@v4

      - name: Download Maven artifacts (macOS aarch64)
        uses: actions/download-artifact@v4
        with:
          name: maven-staging-artifacts-macos-aarch64
          path: ./maven-artifacts
        continue-on-error: true

