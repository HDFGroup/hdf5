name: Generate FFM Bindings (jextract)

# This workflow generates FFM bindings for HDF5 using jextract on all platforms.
# It builds HDF5 (minimal configuration) with and without ROS3 VFD on Linux, Windows, and macOS,
# runs jextract to generate FFM bindings, validates platform-independent code is identical,
# and creates a unified artifact with platform-specific feature variants.

on:
  workflow_dispatch:
    inputs:
      java_version:
        description: 'Java version for jextract (24, 25, latest)'
        required: false
        default: '25'
        type: choice
        options:
          - '24'
          - '25'
          - 'latest'
      create_pr:
        description: 'Create PR with generated bindings (future)'
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      java_version:
        description: 'Java version for jextract'
        required: false
        default: '25'
        type: string

permissions:
  contents: read

jobs:
  # Build aws-c-s3 library from source for Ubuntu (no package available)
  # Cache the result for reuse in ROS3 variant builds
  build-aws-c-s3-ubuntu:
    name: Build aws-c-s3 for Ubuntu
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.cache-aws-c-s3.outputs.cache-hit }}
    steps:
      - name: Checkout HDF5 (for aws-c-s3 tag reference)
        uses: actions/checkout@v4

      - name: Get aws-c-s3 sources (main branch)
        uses: actions/checkout@v5
        with:
          repository: awslabs/aws-c-s3
          path: aws-c-s3

      - name: Get aws-c-s3 commit hash
        id: get-sha
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/aws-c-s3
          export AWSCS3_SHA=$(git rev-parse HEAD)
          echo "AWSCS3_SHA=$AWSCS3_SHA" >> $GITHUB_ENV
          echo "sha=$AWSCS3_SHA" >> $GITHUB_OUTPUT
          echo "AWS C S3 SHA: $AWSCS3_SHA"

      - name: Cache/Restore aws-c-s3 installation
        id: cache-aws-c-s3
        uses: actions/cache@v4
        with:
          path: ${{ runner.workspace }}/aws-c-s3-build
          key: ${{ runner.os }}-${{ runner.arch }}-gcc-aws-c-s3-${{ steps.get-sha.outputs.sha }}-Release

      - name: Get aws-lc sources
        if: steps.cache-aws-c-s3.outputs.cache-hit != 'true'
        uses: actions/checkout@v5
        with:
          repository: aws/aws-lc
          path: aws-lc

      - name: Get s2n-tls sources
        if: steps.cache-aws-c-s3.outputs.cache-hit != 'true'
        uses: actions/checkout@v5
        with:
          repository: aws/s2n-tls
          path: s2n-tls

      - name: Get aws-c-common sources
        if: steps.cache-aws-c-s3.outputs.cache-hit != 'true'
        uses: actions/checkout@v5
        with:
          repository: awslabs/aws-c-common
          path: aws-c-common

      - name: Get aws-checksums sources
        if: steps.cache-aws-c-s3.outputs.cache-hit != 'true'
        uses: actions/checkout@v5
        with:
          repository: awslabs/aws-checksums
          path: aws-checksums

      - name: Get aws-c-cal sources
        if: steps.cache-aws-c-s3.outputs.cache-hit != 'true'
        uses: actions/checkout@v5
        with:
          repository: awslabs/aws-c-cal
          path: aws-c-cal

      - name: Get aws-c-io sources
        if: steps.cache-aws-c-s3.outputs.cache-hit != 'true'
        uses: actions/checkout@v5
        with:
          repository: awslabs/aws-c-io
          path: aws-c-io

      - name: Get aws-c-compression sources
        if: steps.cache-aws-c-s3.outputs.cache-hit != 'true'
        uses: actions/checkout@v5
        with:
          repository: awslabs/aws-c-compression
          path: aws-c-compression

      - name: Get aws-c-http sources
        if: steps.cache-aws-c-s3.outputs.cache-hit != 'true'
        uses: actions/checkout@v5
        with:
          repository: awslabs/aws-c-http
          path: aws-c-http

      - name: Get aws-c-sdkutils sources
        if: steps.cache-aws-c-s3.outputs.cache-hit != 'true'
        uses: actions/checkout@v5
        with:
          repository: awslabs/aws-c-sdkutils
          path: aws-c-sdkutils

      - name: Get aws-c-auth sources
        if: steps.cache-aws-c-s3.outputs.cache-hit != 'true'
        uses: actions/checkout@v5
        with:
          repository: awslabs/aws-c-auth
          path: aws-c-auth

      - name: Build aws-c-s3 from source
        if: steps.cache-aws-c-s3.outputs.cache-hit != 'true'
        run: |
          # Build aws-lc
          echo "Building aws-lc..."
          cmake -S aws-lc -B aws-lc/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=${{ runner.workspace }}/aws-c-s3-build \
            -DBUILD_SHARED_LIBS=1
          cmake --build aws-lc/build --parallel 3 --config Release --target install

          # Build s2n-tls
          echo "Building s2n-tls..."
          cmake -S s2n-tls -B s2n-tls/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=${{ runner.workspace }}/aws-c-s3-build \
            -DCMAKE_PREFIX_PATH=${{ runner.workspace }}/aws-c-s3-build \
            -DBUILD_SHARED_LIBS=1
          cmake --build s2n-tls/build --parallel 3 --config Release --target install

          # Build aws-c-common
          echo "Building aws-c-common..."
          cmake -S aws-c-common -B aws-c-common/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=${{ runner.workspace }}/aws-c-s3-build \
            -DBUILD_SHARED_LIBS=1
          cmake --build aws-c-common/build --parallel 3 --config Release --target install

          # Build aws-checksums
          echo "Building aws-checksums..."
          cmake -S aws-checksums -B aws-checksums/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=${{ runner.workspace }}/aws-c-s3-build \
            -DCMAKE_PREFIX_PATH=${{ runner.workspace }}/aws-c-s3-build \
            -DBUILD_SHARED_LIBS=1
          cmake --build aws-checksums/build --parallel 3 --config Release --target install

          # Build aws-c-cal
          echo "Building aws-c-cal..."
          cmake -S aws-c-cal -B aws-c-cal/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=${{ runner.workspace }}/aws-c-s3-build \
            -DCMAKE_PREFIX_PATH=${{ runner.workspace }}/aws-c-s3-build \
            -DBUILD_SHARED_LIBS=1
          cmake --build aws-c-cal/build --parallel 3 --config Release --target install

          # Build aws-c-io
          echo "Building aws-c-io..."
          cmake -S aws-c-io -B aws-c-io/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=${{ runner.workspace }}/aws-c-s3-build \
            -DCMAKE_PREFIX_PATH=${{ runner.workspace }}/aws-c-s3-build \
            -DBUILD_SHARED_LIBS=1
          cmake --build aws-c-io/build --parallel 3 --config Release --target install

          # Build aws-c-compression
          echo "Building aws-c-compression..."
          cmake -S aws-c-compression -B aws-c-compression/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=${{ runner.workspace }}/aws-c-s3-build \
            -DCMAKE_PREFIX_PATH=${{ runner.workspace }}/aws-c-s3-build \
            -DBUILD_SHARED_LIBS=1
          cmake --build aws-c-compression/build --parallel 3 --config Release --target install

          # Build aws-c-http
          echo "Building aws-c-http..."
          cmake -S aws-c-http -B aws-c-http/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=${{ runner.workspace }}/aws-c-s3-build \
            -DCMAKE_PREFIX_PATH=${{ runner.workspace }}/aws-c-s3-build \
            -DBUILD_SHARED_LIBS=1
          cmake --build aws-c-http/build --parallel 3 --config Release --target install

          # Build aws-c-sdkutils
          echo "Building aws-c-sdkutils..."
          cmake -S aws-c-sdkutils -B aws-c-sdkutils/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=${{ runner.workspace }}/aws-c-s3-build \
            -DCMAKE_PREFIX_PATH=${{ runner.workspace }}/aws-c-s3-build \
            -DBUILD_SHARED_LIBS=1
          cmake --build aws-c-sdkutils/build --parallel 3 --config Release --target install

          # Build aws-c-auth
          echo "Building aws-c-auth..."
          cmake -S aws-c-auth -B aws-c-auth/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=${{ runner.workspace }}/aws-c-s3-build \
            -DCMAKE_PREFIX_PATH=${{ runner.workspace }}/aws-c-s3-build \
            -DBUILD_SHARED_LIBS=1
          cmake --build aws-c-auth/build --parallel 3 --config Release --target install

          # Build aws-c-s3
          echo "Building aws-c-s3..."
          cmake -S aws-c-s3 -B aws-c-s3/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=${{ runner.workspace }}/aws-c-s3-build \
            -DCMAKE_PREFIX_PATH=${{ runner.workspace }}/aws-c-s3-build \
            -DBUILD_SHARED_LIBS=1
          cmake --build aws-c-s3/build --parallel 3 --config Release --target install

      - name: Tar aws-c-s3 installation
        run: tar -cvf libaws-c-s3.tar -C ${{ runner.workspace }} aws-c-s3-build

      - name: Upload aws-c-s3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: libaws-c-s3-ubuntu
          path: libaws-c-s3.tar
          retention-days: 7

  build-hdf5-and-jextract:
    name: Build HDF5 and Run jextract (${{ matrix.platform }} - ${{ matrix.variant }})
    runs-on: ${{ matrix.os }}
    needs: build-aws-c-s3-ubuntu
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds
          - platform: linux
            os: ubuntu-latest
            variant: plain
            cmake_preset: ci-StdShar-GNUC
            enable_ros3: 'OFF'
            shell: bash

          - platform: linux
            os: ubuntu-latest
            variant: ros3
            cmake_preset: ci-StdShar-GNUC-S3
            enable_ros3: 'ON'
            shell: bash

          # Windows builds
          - platform: windows
            os: windows-latest
            variant: plain
            cmake_preset: ci-StdShar-MSVC
            enable_ros3: 'OFF'
            shell: pwsh

          - platform: windows
            os: windows-latest
            variant: ros3
            cmake_preset: ci-StdShar-MSVC
            enable_ros3: 'ON'
            shell: pwsh

          # macOS builds
          - platform: macos
            os: macos-latest
            variant: plain
            cmake_preset: ci-StdShar-Clang
            enable_ros3: 'OFF'
            shell: bash

          - platform: macos
            os: macos-latest
            variant: ros3
            cmake_preset: ci-StdShar-Clang
            enable_ros3: 'ON'
            shell: bash

    steps:
      - name: Checkout HDF5
        uses: actions/checkout@v4

      - name: Set up Java ${{ inputs.java_version || '25' }}
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: ${{ inputs.java_version || '25' }}

      - name: Install jextract (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          echo "Installing jextract..."

          # Try multiple jextract versions (latest to older)
          # Check https://jdk.java.net/jextract/ for available builds

          if [[ "$RUNNER_OS" == "macOS" ]]; then
            PLATFORM="macos-x64"
          else
            PLATFORM="linux-x64"
          fi

          # Try different versions (current as of October 2025)
          # Check https://jdk.java.net/jextract/ for latest builds
          JEXTRACT_URLS=(
            "https://download.java.net/java/early_access/jextract/22/6/openjdk-22-jextract+6-47_${PLATFORM}_bin.tar.gz"
            "https://download.java.net/java/early_access/jextract/21/5/openjdk-21-jextract+5-31_${PLATFORM}_bin.tar.gz"
            "https://download.java.net/java/early_access/jextract/20/1/openjdk-20-jextract+1-2_${PLATFORM}_bin.tar.gz"
          )

          mkdir -p $HOME/jextract
          cd $HOME/jextract

          SUCCESS=false
          for URL in "${JEXTRACT_URLS[@]}"; do
            echo "Trying to download from: $URL"
            if curl -L -f -o jextract.tar.gz "$URL" 2>/dev/null; then
              echo "Download successful!"
              tar -xzf jextract.tar.gz --strip-components=1
              SUCCESS=true
              break
            else
              echo "Failed to download from $URL, trying next..."
            fi
          done

          if [ "$SUCCESS" = false ]; then
            echo "ERROR: Failed to download jextract from any known source"
            echo "Please check https://jdk.java.net/jextract/ for available builds"
            exit 1
          fi

          # Set environment variable
          echo "JEXTRACT_HOME=$HOME/jextract" >> $GITHUB_ENV
          echo "PATH=$HOME/jextract/bin:$PATH" >> $GITHUB_ENV

          # Verify installation
          $HOME/jextract/bin/jextract --version || echo "Jextract installed (version check may not be supported)"

      - name: Install jextract (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "Installing jextract..."

          # Try multiple jextract versions (latest to older)
          # Check https://jdk.java.net/jextract/ for available builds
          # Note: Windows now uses .tar.gz format
          $JextractUrls = @(
            "https://download.java.net/java/early_access/jextract/22/6/openjdk-22-jextract+6-47_windows-x64_bin.tar.gz",
            "https://download.java.net/java/early_access/jextract/21/5/openjdk-21-jextract+5-31_windows-x64_bin.tar.gz",
            "https://download.java.net/java/early_access/jextract/20/1/openjdk-20-jextract+1-2_windows-x64_bin.tar.gz"
          )

          $JextractHome = "$env:USERPROFILE\jextract"
          New-Item -ItemType Directory -Force -Path $JextractHome

          $Success = $false
          foreach ($Url in $JextractUrls) {
            Write-Host "Trying to download from: $Url"
            $TarPath = "$JextractHome\jextract.tar.gz"

            try {
              Invoke-WebRequest -Uri $Url -OutFile $TarPath -ErrorAction Stop
              Write-Host "Download successful!"

              # Extract tar.gz using tar command (available in Windows 10+)
              # First, list contents to see structure
              Write-Host "Checking archive contents..."
              $tarList = tar -tzf "$TarPath" 2>&1 | Select-Object -First 5
              Write-Host "Archive structure: $tarList"

              # Extract to temporary location first to see what we get
              $TempExtract = "$JextractHome\temp"
              New-Item -ItemType Directory -Force -Path $TempExtract | Out-Null
              tar -xzf "$TarPath" -C "$TempExtract" 2>&1

              # Find where jextract.bat actually is (Windows uses .bat, not .exe)
              $JextractBat = Get-ChildItem -Path $TempExtract -Filter "jextract.bat" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1

              if ($JextractBat) {
                Write-Host "Found jextract.bat at: $($JextractBat.FullName)"

                # Move the parent directory contents to JextractHome
                $JextractRoot = $JextractBat.Directory.Parent.FullName
                Write-Host "Moving from $JextractRoot to $JextractHome"

                Get-ChildItem -Path $JextractRoot | ForEach-Object {
                  Move-Item -Path $_.FullName -Destination $JextractHome -Force
                }

                # Clean up temp
                Remove-Item -Path $TempExtract -Recurse -Force
                Remove-Item -Path $TarPath -Force

                # Verify
                if (Test-Path "$JextractHome\bin\jextract.bat") {
                  Write-Host "Jextract extracted successfully to $JextractHome"
                  $Success = $true
                  break
                }
              } else {
                Write-Host "Could not find jextract.bat in extracted files"
                Remove-Item -Path $TempExtract -Recurse -Force -ErrorAction SilentlyContinue
              }
            }
            catch {
              Write-Host "Failed to download or extract from $Url, trying next..."
              Write-Host "Error: $_"
            }
          }

          if (-not $Success) {
            Write-Host "ERROR: Failed to download jextract from any known source"
            Write-Host "Please check https://jdk.java.net/jextract/ for available builds"
            exit 1
          }

          # Set environment variables
          "JEXTRACT_HOME=$JextractHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$JextractHome\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          # Verify installation (Windows uses .bat, not .exe)
          & "$JextractHome\bin\jextract.bat" --version
          if (-not $?) {
            Write-Host "Jextract installed (version check may not be supported)"
          }

      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.26.x'

      # ROS3 VFD Dependencies - Platform-specific strategies
      # Ubuntu: Build from source (handled by build-aws-c-s3-ubuntu job)
      # Windows: Use vcpkg package manager
      # macOS: Use Homebrew package manager

      - name: Download aws-c-s3 artifact (Ubuntu ROS3 only)
        if: matrix.platform == 'linux' && matrix.variant == 'ros3'
        uses: actions/download-artifact@v4
        with:
          name: libaws-c-s3-ubuntu

      - name: Extract aws-c-s3 (Ubuntu ROS3 only)
        if: matrix.platform == 'linux' && matrix.variant == 'ros3'
        shell: bash
        run: |
          tar xvf libaws-c-s3.tar -C ${{ runner.workspace }}
          echo "LD_LIBRARY_PATH=${{ runner.workspace }}/aws-c-s3-build/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=${{ runner.workspace }}/aws-c-s3-build" >> $GITHUB_ENV

      - name: Install aws-c-s3 via vcpkg (Windows ROS3 only)
        if: matrix.platform == 'windows' && matrix.variant == 'ros3'
        shell: pwsh
        run: |
          Write-Host "Installing aws-c-s3 via vcpkg..."
          vcpkg install aws-c-s3
          Write-Host "aws-c-s3 installed successfully"

      - name: Install aws-c-s3 via Homebrew (macOS ROS3 only)
        if: matrix.platform == 'macos' && matrix.variant == 'ros3'
        shell: bash
        run: |
          echo "Installing aws-c-s3 via Homebrew..."
          brew install aws-c-s3
          echo "aws-c-s3 installed successfully"

      - name: Configure HDF5 (Minimal build for jextract)
        shell: bash
        run: |
          echo "Configuring HDF5 with ROS3=${{ matrix.enable_ros3 }}..."

          # Convert Windows path to Unix-style for CMake in bash
          INSTALL_PREFIX="${{ github.workspace }}/install"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            # Convert D:\a\hdf5\hdf5 to /d/a/hdf5/hdf5
            INSTALL_PREFIX=$(echo "$INSTALL_PREFIX" | sed 's|\\|/|g' | sed 's|^\([A-Za-z]\):|/\L\1|')
          fi

          # Add vcpkg toolchain for Windows ROS3 builds
          VCPKG_TOOLCHAIN=""
          if [[ "${{ matrix.platform }}" == "windows" && "${{ matrix.variant }}" == "ros3" ]]; then
            VCPKG_TOOLCHAIN="-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake"
          fi

          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DHDF5_BUILD_EXAMPLES=OFF \
            -DBUILD_TESTING=OFF \
            -DHDF5_BUILD_TOOLS=OFF \
            -DHDF5_BUILD_FORTRAN=OFF \
            -DHDF5_BUILD_CPP_LIB=OFF \
            -DHDF5_BUILD_JAVA=OFF \
            -DHDF5_ENABLE_ROS3_VFD=${{ matrix.enable_ros3 }} \
            -DCMAKE_INSTALL_PREFIX="$INSTALL_PREFIX" \
            $VCPKG_TOOLCHAIN

      - name: Build HDF5
        shell: bash
        run: |
          echo "Building HDF5..."
          cmake --build build --config Release -j $(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 2)

      - name: Install HDF5
        shell: bash
        run: |
          echo "Installing HDF5..."
          cmake --install build --config Release

      - name: Run jextract (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          echo "Running jextract..."

          chmod +x bin/jextract-generate.sh

          ./bin/jextract-generate.sh \
            "${{ github.workspace }}/install" \
            "${{ github.workspace }}/jextract-output" \
            "$JEXTRACT_HOME"

          echo "Jextract completed!"

      - name: Run jextract (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "Running jextract..."

          & bin\jextract-generate.bat `
            "${{ github.workspace }}\install" `
            "${{ github.workspace }}\jextract-output" `
            "$env:JEXTRACT_HOME"

          Write-Host "Jextract completed!"

      - name: Upload jextract output
        uses: actions/upload-artifact@v4
        with:
          name: jextract-${{ matrix.platform }}-${{ matrix.variant }}
          path: jextract-output/
          retention-days: 7

  merge-and-validate:
    name: Merge and Validate FFM Bindings
    needs: build-hdf5-and-jextract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout HDF5
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Download all jextract outputs
        uses: actions/download-artifact@v4
        with:
          path: jextract-downloads
          pattern: jextract-*

      - name: List downloaded artifacts
        run: |
          echo "Downloaded artifacts:"
          ls -la jextract-downloads/
          echo ""
          for dir in jextract-downloads/*/; do
            echo "=== $(basename $dir) ==="
            find "$dir" -name "*.java" | wc -l
            echo "Java files found"
            echo ""
          done

      - name: Merge FFM bindings
        run: |
          echo "Merging FFM bindings from all platforms..."

          chmod +x bin/merge-ffm-bindings.py

          python3 bin/merge-ffm-bindings.py \
            ffm-bindings-merged \
            jextract-downloads/jextract-linux-plain \
            jextract-downloads/jextract-linux-ros3 \
            jextract-downloads/jextract-windows-plain \
            jextract-downloads/jextract-windows-ros3 \
            jextract-downloads/jextract-macos-plain \
            jextract-downloads/jextract-macos-ros3

      - name: Display merge summary
        run: |
          echo "============================================"
          echo "FFM Bindings Merge Summary"
          echo "============================================"
          echo ""

          if [ -f ffm-bindings-merged/VALIDATION_REPORT.md ]; then
            cat ffm-bindings-merged/VALIDATION_REPORT.md
          fi

          echo ""
          echo "============================================"
          echo "Output Structure:"
          echo "============================================"
          tree -L 3 ffm-bindings-merged/ || find ffm-bindings-merged/ -type f | head -30

      - name: Upload merged FFM bindings
        uses: actions/upload-artifact@v4
        with:
          name: ffm-bindings-merged
          path: ffm-bindings-merged/
          retention-days: 30

      - name: Upload validation report
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: ffm-bindings-merged/VALIDATION_REPORT.md
          retention-days: 30

  create-summary:
    name: Create Workflow Summary
    needs: merge-and-validate
    runs-on: ubuntu-latest
    steps:
      - name: Download validation report
        uses: actions/download-artifact@v4
        with:
          name: validation-report

      - name: Create workflow summary
        run: |
          echo "# FFM Bindings Generation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ✅ Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Validation Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat VALIDATION_REPORT.md >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. Download the \`ffm-bindings-merged\` artifact" >> $GITHUB_STEP_SUMMARY
          echo "2. Review the generated bindings" >> $GITHUB_STEP_SUMMARY
