name: Link Checker

on:
  workflow_dispatch:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-links:
    name: Check Documentation Links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        # Combines all 'apt install' commands into a single, faster layer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libunwind-dev \
            graphviz \
            doxygen \
            cmake

      - name: Build Documentation
        id: build_docs # Give step an ID for referencing its output directory
        run: |
          mkdir build
          cd build
          cmake -DHDF5_BUILD_DOC:BOOL=ON ..
          make doxygen
          # Set an output variable for the generated HTML path
          echo "html_path=$(pwd)/hdf5lib_docs/html" >> $GITHUB_OUTPUT

      - name: Run Link Checker (External)
        id: lychee
        uses: lycheeverse/lychee-action@v1.9.3
        with:
          # All configuration is passed as command-line arguments
          # A multi-line string (>) is used for readability
          args: >
            --verbose
            --format markdown
            --output ./external-report.md
            --base ${{ steps.build_docs.outputs.html_path }}
            --max-retries 3
            --retry-wait-time 5
            --timeout 30
            --user-agent "Mozilla/5.0 (compatible; Lychee/v0.1)"
            --exclude "eigen.tuxfamily.org"
            --exclude "gnu.org"
            --exclude "en.wikipedia.org"
            --exclude "help.hdfgroup.org"
            --exclude "libpng.org"
            --exclude "my.cdash.org"
            --exclude "www.oreilly.com"
            --exclude "preshing.com"
            --exclude "semver.org"
            --exclude "sourceforge.net"
            --exclude "www.youtube.com"
            --exclude "youtu.be"
            --exclude "hdfeos.org"
            "${{ steps.build_docs.outputs.html_path }}/**/*.html"
        # Don't fail the entire workflow for flaky external links
        continue-on-error: true

      - name: Run Link Checker (Internal)
        # This separate, offline check will fail the job if an internal link is broken
        uses: lycheeverse/lychee-action@v1.9.3
        with:
          args: >
            --offline
            --exclude-all-private
            --format markdown
            --output ./internal-report.md
            --base ${{ steps.build_docs.outputs.html_path }}
            "${{ steps.build_docs.outputs.html_path }}/**/*.html"
            
      - name: Publish Report to Job Summary
        # This step always runs to provide a report, even on failure
        if: always()
        run: |
          echo "## 🔗 Link Checker Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### 🌍 External Links" >> $GITHUB_STEP_SUMMARY
          if [ -s external-report.md ]; then
            cat external-report.md >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ All external links are OK." >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🏠 Internal Links" >> $GITHUB_STEP_SUMMARY
          if [ -s internal-report.md ]; then
            cat internal-report.md >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ All internal links are OK." >> $GITHUB_STEP_SUMMARY
          fi
