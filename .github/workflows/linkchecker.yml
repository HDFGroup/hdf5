name: Link Checker (lychee)

on:
  workflow_dispatch:
  push:
  pull_request:
    branches: [ develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-links:
    name: Check Documentation Links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libunwind-dev \
            graphviz \
            doxygen \
            cmake

      - name: Build Documentation
        id: build_docs
        run: |
          mkdir build
          cd build
          cmake -DHDF5_BUILD_DOC:BOOL=ON ..
          make doxygen
          echo "html_path=$(pwd)/hdf5lib_docs/html" >> $GITHUB_OUTPUT

      - name: Run Comprehensive Link Check
        uses: lycheeverse/lychee-action@v1.9.3
        with:
          # Remove --format markdown to avoid --output conflicts
          # The action handles output formatting internally
          args: >
            --verbose
            --base ${{ steps.build_docs.outputs.html_path }}
            --max-retries 3
            --retry-wait-time 5
            --timeout 30
            --user-agent "Mozilla/5.0 (compatible; Lychee/v0.1)"
            --exclude "eigen.tuxfamily.org"
            --exclude "gnu.org"
            --exclude "en.wikipedia.org"
            --exclude "help.hdfgroup.org"
            --exclude "libpng.org"
            --exclude "my.cdash.org"
            --exclude "www.oreilly.com"
            --exclude "preshing.com"
            --exclude "semver.org"
            --exclude "sourceforge.net"
            --exclude "www.youtube.com"
            --exclude "youtu.be"
            --exclude "hdfeos.org"
            "${{ steps.build_docs.outputs.html_path }}/**/*.html"
          # Explicitly fail the job on broken links
          fail: true

      - name: Publish Report to Job Summary
        # This step runs only if the link check fails
        if: failure()
        run: |
          echo "## 🔗 Link Checker Report" >> $GITHUB_STEP_SUMMARY
          echo "❌ **Link check failed!** The following issues were found:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # The lychee-action creates a report file by default
          if [ -f .lycheecache ]; then
            echo "Cache information available in .lycheecache" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Check if there's a lychee output file
          if ls lychee-out.* 1> /dev/null 2>&1; then
            echo "### Detailed Report:" >> $GITHUB_STEP_SUMMARY
            for file in lychee-out.*; do
              echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
              cat "$file" >> $GITHUB_STEP_SUMMARY
              echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            done
          fi

      - name: Success Summary
        # This step runs only if the link check succeeds
        if: success()
        run: |
          echo "## 🔗 Link Checker Report" >> $GITHUB_STEP_SUMMARY
          echo "✅ **All links are valid!** No broken links found in the documentation." >> $GITHUB_STEP_SUMMARY
