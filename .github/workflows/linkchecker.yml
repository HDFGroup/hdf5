name: Link Checker

on:
  workflow_dispatch:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-links:
    name: Check Documentation Links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libunwind-dev \
            graphviz \
            doxygen \
            cmake

      - name: Build Documentation
        id: build_docs
        run: |
          mkdir build
          cd build
          cmake -DHDF5_BUILD_DOC:BOOL=ON ..
          make doxygen
          echo "html_path=$(pwd)/hdf5lib_docs/html" >> $GITHUB_OUTPUT

      - name: Run Comprehensive Link Check
        # This single step checks all links and will fail the job on any error.
        uses: lycheeverse/lychee-action@v1.9.3
        with:
          args: >
            --verbose
            --format markdown
            --output ./link-report.md
            --base ${{ steps.build_docs.outputs.html_path }}
            --max-retries 3
            --retry-wait-time 5
            --timeout 30
            --user-agent "Mozilla/5.0 (compatible; Lychee/v0.1)"
            --exclude "eigen.tuxfamily.org"
            --exclude "gnu.org"
            --exclude "en.wikipedia.org"
            --exclude "help.hdfgroup.org"
            --exclude "libpng.org"
            --exclude "my.cdash.org"
            --exclude "www.oreilly.com"
            --exclude "preshing.com"
            --exclude "semver.org"
            --exclude "sourceforge.net"
            --exclude "www.youtube.com"
            --exclude "youtu.be"
            --exclude "hdfeos.org"
            "${{ steps.build_docs.outputs.html_path }}/**/*.html"
        # The 'continue-on-error' key is omitted, so the workflow
        # will now fail if lychee finds any broken links.

      - name: Publish Report to Job Summary
        # This step always runs to provide a report, even if the check fails.
        if: always()
        run: |
          echo "## 🔗 Link Checker Report" >> $GITHUB_STEP_SUMMARY
          echo "The workflow is configured to fail if any link is invalid." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -s link-report.md ]; then
            cat link-report.md >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ The link check passed without generating a report of failures." >> $GITHUB_STEP_SUMMARY
          fi

