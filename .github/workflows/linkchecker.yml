name: Link Checker (lychee)

on:
  workflow_dispatch:
  push:
  pull_request:
    branches: [ develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-links:
    name: Check Documentation Links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libunwind-dev \
            graphviz \
            doxygen \
            cmake

      - name: Build Documentation
        id: build_docs
        run: |
          mkdir build
          cd build
          cmake -DHDF5_BUILD_DOC:BOOL=ON ..
          make doxygen
          echo "html_path=$(pwd)/hdf5lib_docs/html" >> $GITHUB_OUTPUT

      - name: Run Comprehensive Link Check
        id: lychee
        uses: lycheeverse/lychee-action@v1.9.3
        with:
          args: >
            --verbose
            --base ${{ steps.build_docs.outputs.html_path }}
            --max-retries 3
            --retry-wait-time 5
            --timeout 30
            --user-agent "Mozilla/5.0 (compatible; Lychee/v0.1)"
            --exclude "eigen.tuxfamily.org"
            --exclude "gnu.org"
            --exclude "en.wikipedia.org"
            --exclude "help.hdfgroup.org"
            --exclude "libpng.org"
            --exclude "my.cdash.org"
            --exclude "www.oreilly.com"
            --exclude "preshing.com"
            --exclude "semver.org"
            --exclude "sourceforge.net"
            --exclude "www.youtube.com"
            --exclude "youtu.be"
            --exclude "hdfeos.org"
            --exclude "github.com"
            --exclude "stackoverflow.com"
            --exclude "reddit.com"
            --exclude "twitter.com"
            --exclude "linkedin.com"
            "${{ steps.build_docs.outputs.html_path }}/**/*.html"
          output: lychee-report.md
          format: markdown
          # Don't fail immediately, let us analyze the results
          fail: false

      - name: Analyze Link Check Results
        id: analyze
        if: always()
        run: |
          echo "Analyzing lychee results..."
          
          # Check if lychee report exists
          if [ -f "lychee-report.md" ]; then
            echo "Report file found"
            cat lychee-report.md
            
            # Count actual errors (not just excluded/ignored)
            ERRORS=$(grep -c "❌\|✗\|ERROR\|FAILED" lychee-report.md || echo "0")
            BROKEN_LINKS=$(grep -E "❌|✗|ERROR|FAILED" lychee-report.md || echo "")
            
            echo "error_count=$ERRORS" >> $GITHUB_OUTPUT
            
            # Save broken links to a file for the summary
            if [ "$ERRORS" -gt 0 ]; then
              echo "$BROKEN_LINKS" > broken_links.txt
              echo "has_broken_links=true" >> $GITHUB_OUTPUT
            else
              echo "has_broken_links=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "No report file found"
            echo "has_broken_links=false" >> $GITHUB_OUTPUT
            echo "error_count=0" >> $GITHUB_OUTPUT
          fi

      - name: Publish Report to Job Summary
        if: always()
        run: |
          echo "## 🔗 Link Checker Report" >> "$GITHUB_STEP_SUMMARY"
          
          HAS_BROKEN_LINKS="${{ steps.analyze.outputs.has_broken_links }}"
          ERROR_COUNT="${{ steps.analyze.outputs.error_count }}"
          
          if [ "$HAS_BROKEN_LINKS" = "true" ]; then
            echo "❌ **Found $ERROR_COUNT broken link(s)!**" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Broken Links:" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            if [ -f "broken_links.txt" ]; then
              cat broken_links.txt >> "$GITHUB_STEP_SUMMARY"
            else
              echo "No broken links file found" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ **No broken links found!**" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "All links are either valid or were excluded from checking." >> "$GITHUB_STEP_SUMMARY"
          fi
          
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Full Report:" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "lychee-report.md" ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat lychee-report.md >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No detailed report available." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail Job on Broken Links
        if: steps.analyze.outputs.has_broken_links == 'true'
        run: |
          ERROR_COUNT="${{ steps.analyze.outputs.error_count }}"
          echo "Found $ERROR_COUNT broken link(s). Failing the job."
          exit 1

