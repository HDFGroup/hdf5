name: Link Checker (lychee)

on:
  workflow_dispatch:
  push:
  pull_request:
    branches: [ develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-links:
    name: Check Documentation Links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libunwind-dev \
            graphviz \
            doxygen \
            cmake

      - name: Build Documentation
        id: build_docs
        run: |
          mkdir build
          cd build
          cmake -DHDF5_BUILD_DOC:BOOL=ON ..
          make doxygen
          echo "html_path=$(pwd)/hdf5lib_docs/html" >> $GITHUB_OUTPUT

      - name: Run Comprehensive Link Check
        id: lychee
        uses: lycheeverse/lychee-action@v1.9.3
        with:
          args: >
            --verbose
            --base ${{ steps.build_docs.outputs.html_path }}
            --max-retries 4
            --max-concurrency 8
            --retry-wait-time 10
            --timeout 30
            --user-agent "Mozilla/5.0 (compatible; Lychee/v0.1)"
            --exclude "eigen.tuxfamily.org"
            --exclude "gnu.org"
            --exclude "en.wikipedia.org"
            --exclude "help.hdfgroup.org"
            --exclude "libpng.org"
            --exclude "my.cdash.org"
            --exclude "www.oreilly.com"
            --exclude "preshing.com"
            --exclude "semver.org"
            --exclude "sourceforge.net"
            --exclude "www.youtube.com"
            --exclude "youtu.be"
            --exclude "hdfeos.org"
            --exclude "github.com"
            --exclude "stackoverflow.com"
            --exclude "reddit.com"
            --exclude "twitter.com"
            --exclude "linkedin.com"
            "${{ steps.build_docs.outputs.html_path }}/**/*.html"
          output: lychee-report.md
          format: markdown
          # Don't fail the step immediately; we'll analyze the results first.
          fail: false

      - name: Publish Report to Job Summary
        if: always()
        run: |
          echo "## 🔗 Link Checker Report" >> "$GITHUB_STEP_SUMMARY"
          
          EXIT_CODE="${{ steps.lychee.outputs.exit_code }}"

          if [ "$EXIT_CODE" = '0' ]; then
            echo "✅ **No broken links found!**" >> "$GITHUB_STEP_SUMMARY"
          else
            # Count actual broken links marked with the ❌ emoji.
            # Default to 0 if grep finds nothing or fails.
            FAILED_COUNT=$(grep -c "❌" lychee-report.md || echo 0)

            if [ "$FAILED_COUNT" -gt 0 ]; then
              echo "❌ **Found $FAILED_COUNT broken link(s)!**" >> "$GITHUB_STEP_SUMMARY"
            else
              # If exit code is non-zero but no links are marked as failed, it's likely a config/input error.
              echo "⚠️ **Link checker failed with an error (Exit Code: $EXIT_CODE).**" >> "$GITHUB_STEP_SUMMARY"
              echo "This may indicate a configuration or network issue, not necessarily a broken link." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Full Report:" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "lychee-report.md" ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat lychee-report.md >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No detailed report available." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail Job on Broken Links
        if: steps.lychee.outputs.exit_code != '0'
        run: |
          echo "The link checker job failed. See the report in the job summary for details."
          exit 1
