name: hdf5 dev cmake CI

# Triggers the workflow on push or pull request or on demand
on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '.github/CODEOWNERS'
      - '.github/FUNDING.yml'
      - 'docs/**'
      - 'release_docs/**'
      - 'ACKNOWLEDGEMENTS'
      - 'LICENSE**'
      - '**.md'
  # No paths-ignore for pull requests: the "CI status" check must always
  # report, or a required check would wait forever on a docs-only PR. The
  # check-changes job applies the push trigger's paths-ignore list instead.
  pull_request:
    branches: [ develop ]

# Using concurrency to cancel any in-progress job or run
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
    # Decide whether a pull request changes anything besides the files the
    # push trigger ignores. Keep the patterns in sync with paths-ignore above.
    check-changes:
      name: "Check changed files"
      runs-on: ubuntu-latest
      permissions:
        contents: read
        pull-requests: read
      outputs:
        code: ${{ steps.check.outputs.code }}
      steps:
        - id: check
          env:
            GH_TOKEN: ${{ github.token }}
            EVENT: ${{ github.event_name }}
            PR: ${{ github.event.pull_request.number }}
            REPO: ${{ github.repository }}
          run: |
            code=true
            if [ "$EVENT" = pull_request ]; then
              # Include the old name of renamed files. The API lists at most
              # 3000 files; treat a larger PR as a code change.
              files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" \
                        --jq '.[] | .filename, (.previous_filename // empty)')
              n=$(printf '%s\n' "$files" | grep -c . || true)
              if [ "$n" -gt 0 ] && [ "$n" -lt 3000 ]; then
                code=false
                while IFS= read -r f; do
                  case "$f" in
                    .github/CODEOWNERS|.github/FUNDING.yml|docs/*|release_docs/*|ACKNOWLEDGEMENTS|LICENSE*|*.md) ;;
                    *) code=true; break ;;
                  esac
                done <<< "$files"
              fi
            fi
            echo "code=$code" | tee -a "$GITHUB_OUTPUT"

    call-workflow-special-cmake:
      name: "Special Workflows"
      needs: check-changes
      if: needs.check-changes.outputs.code == 'true'
      uses: ./.github/workflows/main-spc.yml

    # Build aws-c-s3 library for ROS3 workflows
    build-aws-c-s3-release:
      name: "Build aws-c-s3 (Release)"
      needs: check-changes
      if: needs.check-changes.outputs.code == 'true'
      uses: ./.github/workflows/build-aws-c-s3.yml
      with:
        build_mode: "Release"
        aws_c_s3_tag: "v0.8.0"

    call-workflow-ros3-cmake:
      name: "ROS3 VFD Workflows"
      needs: build-aws-c-s3-release
      uses: ./.github/workflows/vfd-ros3.yml
      with:
        build_mode: "Release"
        aws_c_s3_build_type: "package"

    call-workflow-ros3-ffm-cmake:
      name: "ROS3 VFD FFM Workflows"
      needs: build-aws-c-s3-release
      uses: ./.github/workflows/vfd-ros3.yml
      with:
        build_mode: "Release"
        aws_c_s3_build_type: "package"
        save_binary: "ffm"
        java_version: "latest"
        force_java_implementation: "ffm"

    call-debug-concurrent-cmake:
        name: "Debug Concurrency Workflows"
        needs: check-changes
        if: needs.check-changes.outputs.code == 'true'
        uses: ./.github/workflows/main.yml
        with:
            cmake_version: "latest"
            concurrent: "CC"
            thread_safety: ""
            build_mode: "Debug"

    call-static-debug-concurrent-cmake:
        name: "Debug Static Concurrency Workflows"
        needs: check-changes
        if: needs.check-changes.outputs.code == 'true'
        uses: ./.github/workflows/main-static.yml
        with:
            cmake_version: "latest"
            concurrent: "CC"
            thread_safety: ""
            build_mode: "Debug"

    call-release-concurrent-cmake:
        name: "Release Concurrency Workflows"
        needs: check-changes
        if: needs.check-changes.outputs.code == 'true'
        uses: ./.github/workflows/main.yml
        with:
            cmake_version: "latest"
            concurrent: "CC"
            thread_safety: ""
            build_mode: "Release"

    call-debug-thread-cmake:
        name: "Debug Thread-Safety Workflows"
        needs: check-changes
        if: needs.check-changes.outputs.code == 'true'
        uses: ./.github/workflows/main.yml
        with:
            cmake_version: "latest"
            concurrent: ""
            thread_safety: "TS"
            build_mode: "Debug"

    call-static-debug-thread-cmake:
        name: "Debug Static Thread-Safety Workflows"
        needs: check-changes
        if: needs.check-changes.outputs.code == 'true'
        uses: ./.github/workflows/main-static.yml
        with:
            cmake_version: "latest"
            concurrent: ""
            thread_safety: "TS"
            build_mode: "Debug"

    call-release-thread-cmake:
        name: "Release Thread-Safety Workflows"
        needs: check-changes
        if: needs.check-changes.outputs.code == 'true'
        uses: ./.github/workflows/main.yml
        with:
            cmake_version: "latest"
            concurrent: ""
            thread_safety: "TS"
            build_mode: "Release"

    call-debug-cmake:
        name: "Debug Workflows"
        needs: check-changes
        if: needs.check-changes.outputs.code == 'true'
        uses: ./.github/workflows/main.yml
        with:
            cmake_version: "latest"
            concurrent: ""
            thread_safety: ""
            build_mode: "Debug"
            force_java_implementation: "jni"

    call-debug-static-cmake:
        name: "Debug Static Workflows"
        needs: check-changes
        if: needs.check-changes.outputs.code == 'true'
        uses: ./.github/workflows/main-static.yml
        with:
            cmake_version: "latest"
            concurrent: ""
            thread_safety: ""
            build_mode: "Debug"

    call-release-cross:
        name: "Release Cross Compile Workflows"
        needs: check-changes
        if: needs.check-changes.outputs.code == 'true'
        uses: ./.github/workflows/cross-compile.yml
        with:
            build_mode: "Release"

    call-release-cmake:
        name: "Release Workflows"
        needs: check-changes
        if: needs.check-changes.outputs.code == 'true'
        uses: ./.github/workflows/main.yml
        with:
            cmake_version: "latest"
            concurrent: ""
            thread_safety: ""
            build_mode: "Release"
            save_binary: "std"
            force_java_implementation: "jni"

    call-release-static:
        name: "Release Static Workflows"
        needs: check-changes
        if: needs.check-changes.outputs.code == 'true'
        uses: ./.github/workflows/main-static.yml
        with:
            cmake_version: "latest"
            concurrent: ""
            thread_safety: ""
            build_mode: "Release"

    call-release-cmakeMin:
        name: "Minimum Release Workflows"
        needs: check-changes
        if: needs.check-changes.outputs.code == 'true'
        uses: ./.github/workflows/main.yml
        with:
            cmake_version: "3.26.0"
            concurrent: ""
            thread_safety: ""
            build_mode: "Release"
            force_java_implementation: "jni"
            java_version: 11
            win_runner: "windows-2022"
            win_vs_generator: "Visual Studio 17 2022"

    call-jni-latest-java:
        name: "JNI Latest Java Testing"
        needs: check-changes
        if: needs.check-changes.outputs.code == 'true'
        uses: ./.github/workflows/main.yml
        with:
            cmake_version: "latest"
            concurrent: ""
            thread_safety: ""
            build_mode: "Release"
            java_version: "latest"
            force_java_implementation: "jni"

    call-ffm-latest-java:
        name: "FFM Latest Java Testing"
        needs: check-changes
        if: needs.check-changes.outputs.code == 'true'
        uses: ./.github/workflows/main.yml
        with:
            cmake_version: "latest"
            concurrent: ""
            thread_safety: ""
            build_mode: "Release"
            save_binary: "ffm"
            java_version: "latest"
            force_java_implementation: "ffm"

    call-arm64-cmake:
        name: "arm64 Workflows"
        needs: check-changes
        if: needs.check-changes.outputs.code == 'true'
        uses: ./.github/workflows/arm-main.yml
        with:
            cmake_version: "latest"
            concurrent: ""
            thread_safety: ""
            build_mode: "Release"
            save_binary: "arm64"

    call-debug-arm64-cmake:
        name: "arm64 Workflows"
        needs: check-changes
        if: needs.check-changes.outputs.code == 'true'
        uses: ./.github/workflows/arm-main.yml
        with:
            cmake_version: "latest"
            concurrent: ""
            thread_safety: ""
            build_mode: "Debug"

    call-maven-staging:
        name: "Maven Staging Tests"
        needs: call-release-cmake
        permissions:
            contents: read
            packages: write
            pull-requests: write
        uses: ./.github/workflows/maven-staging.yml
        with:
            test_maven_deployment: true
            use_snapshot_version: true
            java_implementation: "jni"
            platforms: "all-platforms"

    call-maven-ffm-staging:
        name: "Maven Staging Tests"
        needs: call-ffm-latest-java
        permissions:
            contents: read
            packages: write
            pull-requests: write
        uses: ./.github/workflows/maven-staging.yml
        with:
            test_maven_deployment: true
            use_snapshot_version: true
            java_implementation: "ffm"
            platforms: "all-platforms"

    call-release-bintest:
        name: "Test Release Binaries"
        needs: [call-release-cmake, call-maven-staging]
        uses: ./.github/workflows/bintest.yml
        with:
            build_mode: "Release"
            save_binary: "std"
            java_version: "21"

    call-release-ffm-bintest:
        name: "Test FFM Release Binaries"
        needs: [call-ffm-latest-java, call-maven-ffm-staging]
        uses: ./.github/workflows/bintest.yml
        with:
            build_mode: "Release"
            save_binary: "ffm"
            java_version: "latest"

    call-release-par:
        name: "Parallel Release Workflows"
        needs: check-changes
        if: needs.check-changes.outputs.code == 'true'
        uses: ./.github/workflows/main-par.yml
        with:
            build_mode: "Release"

    call-debug-par:
        name: "Parallel Debug Workflows"
        needs: check-changes
        if: needs.check-changes.outputs.code == 'true'
        uses: ./.github/workflows/main-par.yml
        with:
            build_mode: "Debug"

    call-release-special-par:
        name: "Parallel Release Special Workflows"
        needs: check-changes
        if: needs.check-changes.outputs.code == 'true'
        uses: ./.github/workflows/main-par-spc.yml
        with:
            build_mode: "Release"

    call-debug-special-par:
        name: "Parallel Debug Special Workflows"
        needs: check-changes
        if: needs.check-changes.outputs.code == 'true'
        uses: ./.github/workflows/main-par-spc.yml
        with:
            build_mode: "Debug"

    call-release-cmake-intel:
        name: "Intel Workflows"
        needs: check-changes
        if: needs.check-changes.outputs.code == 'true'
        uses: ./.github/workflows/intel.yml
        with:
            build_mode: "Release"

    call-release-cmake-nvhpc:
        name: "nvhpc Workflows"
        needs: check-changes
        if: needs.check-changes.outputs.code == 'true'
        uses: ./.github/workflows/nvhpc.yml
        with:
            build_mode: "Release"

    call-release-cmake-aocc:
        name: "aocc Workflows"
        needs: check-changes
        if: needs.check-changes.outputs.code == 'true'
        uses: ./.github/workflows/aocc.yml
        with:
            build_mode: "Release"

    call-release-cmake-xpr:
        name: "TestExpress Workflows"
        needs: check-changes
        if: needs.check-changes.outputs.code == 'true'
        uses: ./.github/workflows/testxpr.yml

#    call-release-cmake-julia:
#        name: "Julia Workflows"
#        uses: ./.github/workflows/julia.yml
#        with:
#         build_mode: "Release"

    call-release-cmake-msys2:
        name: "Msys2 Workflows"
        needs: check-changes
        if: needs.check-changes.outputs.code == 'true'
        uses: ./.github/workflows/msys2.yml
        with:
          build_mode: "Release"

    call-release-cmake-i386:
        name: "i386 Workflows"
        needs: check-changes
        if: needs.check-changes.outputs.code == 'true'
        uses: ./.github/workflows/i386.yml
        with:
            build_mode: "Release"

    # One check that summarizes every job above, for use as the required
    # status check. A called workflow that GitHub rejects before creating any
    # job shows up here as a failure, not as a missing check. Add every new
    # job to this list.
    ci-status:
      name: "CI status"
      if: always()
      needs:
        - check-changes
        - call-workflow-special-cmake
        - build-aws-c-s3-release
        - call-workflow-ros3-cmake
        - call-workflow-ros3-ffm-cmake
        - call-debug-concurrent-cmake
        - call-static-debug-concurrent-cmake
        - call-release-concurrent-cmake
        - call-debug-thread-cmake
        - call-static-debug-thread-cmake
        - call-release-thread-cmake
        - call-debug-cmake
        - call-debug-static-cmake
        - call-release-cross
        - call-release-cmake
        - call-release-static
        - call-release-cmakeMin
        - call-jni-latest-java
        - call-ffm-latest-java
        - call-arm64-cmake
        - call-debug-arm64-cmake
        - call-maven-staging
        - call-maven-ffm-staging
        - call-release-bintest
        - call-release-ffm-bintest
        - call-release-par
        - call-debug-par
        - call-release-special-par
        - call-debug-special-par
        - call-release-cmake-intel
        - call-release-cmake-nvhpc
        - call-release-cmake-aocc
        - call-release-cmake-xpr
        - call-release-cmake-msys2
        - call-release-cmake-i386
      runs-on: ubuntu-latest
      steps:
        - name: Fail unless every job succeeded or was skipped
          env:
            NEEDS: ${{ toJSON(needs) }}
          run: |
            echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
            echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
