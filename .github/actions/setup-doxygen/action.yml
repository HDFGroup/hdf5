name: 'Setup Doxygen'
description: 'Install Doxygen with version that supports Fortran cross-references'
inputs:
  version:
    description: 'Doxygen version to install'
    required: false
    default: '1.16.1'
runs:
  using: 'composite'
  steps:
    - name: Install Doxygen (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        VERSION="${{ inputs.version }}"
        VERSION_UNDERSCORE="${VERSION//./_}"
        mkdir doxygen-install-temp
        cd doxygen-install-temp
        # Try newer naming convention first (doxygen-VERSION.windows.x64.bin.zip)
        if curl -kLSsf "https://github.com/doxygen/doxygen/releases/download/Release_${VERSION_UNDERSCORE}/doxygen-${VERSION}.windows.x64.bin.zip" -o doxygen.zip; then
          echo "Downloaded using newer naming convention"
        else
          # Fall back to older naming convention (doxygen-VERSION.x64.bin.zip)
          echo "Trying older naming convention"
          curl -kLSsf "https://github.com/doxygen/doxygen/releases/download/Release_${VERSION_UNDERSCORE}/doxygen-${VERSION}.x64.bin.zip" -o doxygen.zip
        fi
        unzip doxygen.zip
        cp * c:\\Windows || true
        cd ..
        rm -rf doxygen-install-temp

    - name: Install Doxygen (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        VERSION="${{ inputs.version }}"
        VERSION_UNDERSCORE="${VERSION//./_}"
        wget "https://github.com/doxygen/doxygen/releases/download/Release_${VERSION_UNDERSCORE}/doxygen-${VERSION}.linux.bin.tar.gz"
        tar xzf "doxygen-${VERSION}.linux.bin.tar.gz"
        cd "doxygen-${VERSION}"
        sudo make install
        cd ..
        rm -rf "doxygen-${VERSION}"*

    - name: Install Doxygen (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        VERSION="${{ inputs.version }}"
        VERSION_UNDERSCORE="${VERSION//./_}"
        # Detect architecture
        if [ "$(uname -m)" = "arm64" ]; then
          DMG_FILE="Doxygen-${VERSION}-arm.dmg"
        else
          DMG_FILE="Doxygen-${VERSION}-intel.dmg"
        fi
        wget "https://github.com/doxygen/doxygen/releases/download/Release_${VERSION_UNDERSCORE}/${DMG_FILE}"
        sudo hdiutil attach "${DMG_FILE}"
        sudo cp /Volumes/Doxygen/Doxygen.app/Contents/Resources/doxygen /usr/local/bin/
        sudo cp /Volumes/Doxygen/Doxygen.app/Contents/Resources/doxyindexer /usr/local/bin/
        sudo hdiutil detach /Volumes/Doxygen
        rm "${DMG_FILE}"
