name: 'Setup Doxygen'
description: 'Install Doxygen with version that supports Fortran cross-references'
inputs:
  version:
    description: 'Doxygen version to install'
    required: false
    default: '1.15.0'
runs:
  using: 'composite'
  steps:
    - name: Install Doxygen
      uses: ssciwr/doxygen-install@v1
      with:
        version: ${{ inputs.version }}
